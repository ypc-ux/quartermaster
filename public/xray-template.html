<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CATALYST — Document X-Ray</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:#0B1426;color:#e2e8f0;min-height:100vh}
.hd{background:linear-gradient(135deg,#0B1426,#1a1f3a);border-bottom:1px solid rgba(201,162,39,0.2);padding:24px 32px}
.hd h1{font-family:Georgia,serif;font-size:1.8rem;color:#c9a227}
.hd p{color:#94a3b8;font-size:0.85rem;margin-top:4px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;padding:16px 32px}
.st{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.05);border-radius:10px;padding:16px;text-align:center}
.st .v{font-size:1.8rem;font-weight:700;font-family:Georgia,serif}
.st .l{font-size:0.7rem;color:#94a3b8;text-transform:uppercase;letter-spacing:0.1em;margin-top:4px}
.ct{display:flex;gap:12px;padding:16px 32px;background:rgba(255,255,255,0.02);border-bottom:1px solid rgba(255,255,255,0.05);flex-wrap:wrap;align-items:center}
.ct input,.ct select{background:#1a1f3a;border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:8px 12px;color:#e2e8f0;font-size:0.85rem;min-width:180px}
.ct input:focus,.ct select:focus{outline:none;border-color:#c9a227}
.cnt{color:#94a3b8;font-size:0.8rem;margin-left:auto}
.tw{padding:0 32px 32px;overflow-x:auto}
table{width:100%;border-collapse:collapse;margin-top:16px}
th{text-align:left;padding:10px 12px;font-size:0.7rem;text-transform:uppercase;letter-spacing:0.1em;color:#64748b;border-bottom:1px solid rgba(255,255,255,0.08);position:sticky;top:0;background:#0B1426;z-index:10}
td{padding:8px 12px;font-size:0.82rem;border-bottom:1px solid rgba(255,255,255,0.03)}
tr.fr:hover{background:rgba(201,162,39,0.05)}
tr.hide{display:none}
.b{display:inline-block;padding:2px 8px;border-radius:4px;font-size:0.65rem;font-weight:600;color:#fff;text-transform:uppercase;letter-spacing:0.05em}
.r{color:#c9a227;font-weight:600;white-space:nowrap}
.p{color:#94a3b8;font-size:0.78rem;word-break:break-all}
.up{text-align:center;padding:16px;color:#475569;font-size:0.75rem;border-top:1px solid rgba(255,255,255,0.05)}
</style>
</head>
<body>
<div class="hd">
<h1>CATALYST — Document X-Ray</h1>
<p><!--TOTAL--> files across <!--REPO_COUNT--> repos. Last updated: <!--NOW--></p>
</div>
<div class="stats"><!--STATS--></div>
<div class="ct">
<input type="text" id="q" placeholder="Search files..." oninput="ft()">
<select id="rf" onchange="ft()"><option value="">All Repos</option><!--REPO_OPTS--></select>
<select id="cf" onchange="ft()">
<option value="">All Categories</option>
<option value="STATUS">STATUS (green)</option>
<option value="KEY_ASSET">KEY_ASSET (gold)</option>
<option value="AGENT">AGENT (purple)</option>
<option value="SPEC">SPEC (blue)</option>
<option value="DOCS">DOCS (gray)</option>
<option value="OTHER">OTHER</option>
</select>
<span class="cnt" id="cnt"><!--TOTAL--> files</span>
</div>
<div class="tw">
<table>
<thead><tr><th>Category</th><th>Repo</th><th>File Path</th><th>Modified</th><th>Size</th></tr></thead>
<tbody><!--ROWS--></tbody>
</table>
</div>
<div class="up">Generated by CATALYST OS — <!--NOW--> — agentdatasync.com</div>
<script>
function ft(){
var q=document.getElementById("q").value.toLowerCase();
var r=document.getElementById("rf").value;
var c=document.getElementById("cf").value;
var n=0;
document.querySelectorAll(".fr").forEach(function(row){
var s=(!q||row.cells[2].textContent.toLowerCase().includes(q)||row.cells[1].textContent.toLowerCase().includes(q))&&(!r||row.dataset.repo===r)&&(!c||row.dataset.cat===c);
row.classList.toggle("hide",!s);
if(s)n++;
});
document.getElementById("cnt").textContent=n+" files";
}
</script>
</body>
</html>
